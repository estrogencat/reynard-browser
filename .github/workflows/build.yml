name: Build Reynard

on:
  workflow_dispatch:
    inputs:
      xcode-version:
        description: "Xcode version for setup-xcode (e.g. 16.2, or 'latest-stable')"
        required: false
        default: "latest-stable"
      tag-name:
        description: "Release tag to create/update (blank = auto 'build-<run number>')"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag-name != '' && inputs.tag-name || format('build-{0}', github.run_number) }}

    steps:
      - name: Checkout Reynard
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Init idevice submodule
        run: git submodule update --init --recursive support/idevice

      - name: Cache idevice Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "support/idevice -> target"

      - name: Install ldid
        run: brew install ldid

      - name: Install lld
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install cbindgen
        run: brew install cbindgen

      - name: Install wasm-capable clang
        run: brew install llvm

      - name: Cache patched Gecko engine
        id: cache-gecko
        uses: actions/cache@v4
        with:
          path: engine/firefox
          key: gecko-engine-${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**') }}

      - name: Fetch Gecko engine source
        if: steps.cache-gecko.outputs.cache-hit != 'true'
        run: ./tools/development/update-gecko.sh

      - name: Apply Reynard patches to Gecko
        if: steps.cache-gecko.outputs.cache-hit != 'true'
        run: ./tools/development/apply-patches.sh

      - name: Build idevice static library
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko engine
        run: |
          touch engine/firefox/.mozconfig
          export WASM_CC="$(brew --prefix llvm)/bin/clang"
          export WASM_CXX="$(brew --prefix llvm)/bin/clang++"
          cat > "$PWD/ci.mozconfig" <<'EOF'
ac_add_options --enable-application=mobile/ios
ac_add_options --target=aarch64-apple-ios
ac_add_options --enable-ios-target=13.0
ac_add_options --enable-webrtc
ac_add_options --enable-optimize
ac_add_options --enable-release
ac_add_options --enable-rust-simd
ac_add_options --enable-lto
ac_add_options --disable-debug
ac_add_options --disable-tests
ac_add_options --without-wasm-sandboxed-libraries
EOF
          export MOZCONFIG="$PWD/ci.mozconfig"
          ./tools/development/build-gecko.sh

      - name: Archive Reynard.app (unsigned)
        run: |
          set -euo pipefail
          DIST_DIR="$PWD/dist"
          PROJECT_PATH="$PWD/browser/Reynard.xcodeproj"
          XCCONFIG_PATH="$PWD/browser/Configuration/Reynard.xcconfig"

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp "$XCCONFIG_PATH" "$DIST_DIR/Reynard.xcconfig"

          BUILD_SHA=$(git rev-parse HEAD | cut -c1-7)
          sed -i '' "s/CURRENT_BUILD = .*/CURRENT_BUILD = $BUILD_SHA/" "$DIST_DIR/Reynard.xcconfig"

          xcodebuild archive \
            -scheme "Reynard" \
            -archivePath "$DIST_DIR/Reynard.xcarchive" \
            -project "$PROJECT_PATH" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            -xcconfig "$DIST_DIR/Reynard.xcconfig" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=

      - name: Package IPA (ldid ad-hoc signed)
        run: ./tools/release/create-ipa.sh

      - name: Publish to release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Reynard ${{ env.RELEASE_TAG }}
          body: |
            Automated build from ${{ github.sha }} (run #${{ github.run_number }}).
          draft: false
          prerelease: true
          files: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
